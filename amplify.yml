version: 1
applications:
  - appRoot: website
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm --workspace website run build
      artifacts:
        baseDirectory: website/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - website/.next/cache/**/*